# TEST-only: retain the installed Web image and replace only its Node probe.
# This exact inline command is independently exercised against that old image in CI.
services:
  qrs_web:
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          set -euo pipefail
          exec 3<>/dev/tcp/127.0.0.1/3000
          printf 'GET /auth HTTP/1.0\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3
          IFS=' ' read -r -t 4 version status remainder <&3
          [[ "$version" == HTTP/1.0 || "$version" == HTTP/1.1 ]]
          [[ "$status" == 200 ]]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
