# Included only inside the existing mcp.holymedia.kz HTTPS server block.
# All other routes continue to the unchanged locations in adforge-mcp.
# The release directory contains only the seven reviewed public static files.
location = / {
    alias /srv/holypilot-landing/2026-10-16-static-v1/index.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
}

location = /en {
    alias /srv/holypilot-landing/2026-10-16-static-v1/en.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
}

location = /_holypilot/landing.css {
    alias /srv/holypilot-landing/2026-10-16-static-v1/landing.css;
}

location = /_holypilot/symbol.svg {
