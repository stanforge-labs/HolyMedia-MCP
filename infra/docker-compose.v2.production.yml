name: holymedia-v2

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - /etc/holymedia-v2/compose.env
    environment:
      POSTGRES_DB: ${V2_POSTGRES_DB}
      POSTGRES_USER: ${V2_POSTGRES_USER}
      POSTGRES_PASSWORD: ${V2_POSTGRES_PASSWORD}
    volumes:
      - /var/lib/holymedia-v2/postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:${V2_DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    env_file:
      - /etc/holymedia-v2/compose.env
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --requirepass "$$V2_REDIS_PASSWORD"',
      ]
    volumes:
      - /var/lib/holymedia-v2/redis:/data
    ports:
      - "127.0.0.1:${V2_REDIS_PORT}:6379"
    healthcheck:
      test:
        ["CMD-SHELL", 'redis-cli -a "$$V2_REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  api:
    image: ${V2_IMAGE:?V2_IMAGE is required}
    restart: unless-stopped
    init: true
    env_file:
      - /etc/holymedia-v2/app.env
    volumes:
      - type: bind
        source: /etc/holymedia-v2/oidc/signing-keys.json
        target: /run/holymedia/oidc/signing-keys.json
        read_only: true
    command:
      [
        "sh",
        "-c",
        "pnpm --dir packages/database run prisma:deploy && pnpm --filter @holymedia/api start",
      ]
    ports:
      - "127.0.0.1:${V2_API_PORT}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  worker:
    image: ${V2_IMAGE:?V2_IMAGE is required}
    restart: unless-stopped
    init: true
    working_dir: /workspace/apps/worker
    env_file:
      - /etc/holymedia-v2/app.env
    command: ["pnpm", "--filter", "@holymedia/worker", "start"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "import('ioredis').then(async ({ default: Redis }) => { const redis = new Redis(process.env.REDIS_URL); await redis.ping(); await redis.quit(); }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  web:
    image: ${V2_IMAGE:?V2_IMAGE is required}
    restart: unless-stopped
    init: true
    working_dir: /workspace/apps/web
    env_file:
      - /etc/holymedia-v2/web.env
    command: ["./node_modules/.bin/next", "start"]
    ports:
      - "127.0.0.1:${V2_WEB_PORT}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
