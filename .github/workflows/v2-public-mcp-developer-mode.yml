name: v2-public-mcp-developer-mode

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-mcp-developer-mode
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.ref == 'refs/heads/codex/public-mcp-main-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://holymedia:ci-only-public-mcp@127.0.0.1:5432/public_mcp_devmode
      REDIS_URL: redis://127.0.0.1:6379
      API_PORT: "4000"
      WEB_PORT: "3000"
      SESSION_HASH_SECRET: ci-only-public-mcp-session-hash-secret-0123456789
      PROVIDER_CREDENTIAL_ENCRYPTION_KEYS: "1:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE="
      PROVIDER_CREDENTIAL_CURRENT_KEY_VERSION: "1"
      PUBLIC_MCP_WRITE_SCOPE_ENABLED: "false"
      PUBLIC_MCP_CONTROLLED_WRITE_ENABLED: "false"
      V2_PREVIEW_ONLY: "true"
      V2_CONFIRMED_WRITE_ENABLED: "false"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: public_mcp_devmode
          POSTGRES_USER: holymedia
          POSTGRES_PASSWORD: ci-only-public-mcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U holymedia -d public_mcp_devmode"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Require acceptance secrets without printing values
        shell: bash
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          PUBLIC_MCP_ACCEPTANCE_EMAIL: ${{ secrets.PUBLIC_MCP_ACCEPTANCE_EMAIL }}
          PUBLIC_MCP_ACCEPTANCE_PASSWORD: ${{ secrets.PUBLIC_MCP_ACCEPTANCE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in NGROK_AUTHTOKEN PUBLIC_MCP_ACCEPTANCE_EMAIL PUBLIC_MCP_ACCEPTANCE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "MISSING REQUIRED ACCEPTANCE SECRET: $name" >&2
              exit 1
            fi
          done
      - name: Checkout exact dispatched integration commit
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify integration ancestry and clean migration numbering
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 70482fb521cbb23483123c11e06a7c983078ff88 HEAD
          test -d packages/database/prisma/migrations/0032_public_mcp_oauth_previews
          test -d packages/database/prisma/migrations/0033_public_mcp_browser_approval
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install and test acceptance-only gateway
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          node --test scripts/public_mcp_devmode_gateway.test.mjs
          pnpm --filter @holymedia/api exec vitest run src/mcp/mcp-transport-boundary.http.test.ts src/mcp/oauth-authorization.service.test.ts src/mcp/mcp-public-tools.test.ts src/mcp/mcp.service.test.ts
      - name: Deploy exact integration migrations to disposable PostgreSQL 18
        shell: bash
        env:
          PGPASSWORD: ci-only-public-mcp
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          pnpm --filter @holymedia/database prisma:deploy
          pnpm --filter @holymedia/database prisma:status
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/v2-public-mcp-pg18-assert.sql
          test "$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT current_setting('server_version_num')::int / 10000")" = 18
      - name: Start gateway before application runtime
        shell: bash
        run: |
          set -euo pipefail
          setsid node scripts/public_mcp_devmode_gateway.mjs > "$RUNNER_TEMP/gateway.raw.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/gateway.pid"
          for attempt in {1..20}; do
            if curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/health | grep -q '^502$'; then exit 0; fi
            sleep 1
          done
          echo 'GATEWAY START FAILED' >&2
          exit 1
      - name: Install official ngrok agent and open disposable HTTPS tunnel
        shell: bash
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/ngrok-bin"
          curl -fsSL https://bin.ngrok.com/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar -xz -C "$RUNNER_TEMP/ngrok-bin"
          echo "$RUNNER_TEMP/ngrok-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ngrok-bin/ngrok" version
          help_text=$("$RUNNER_TEMP/ngrok-bin/ngrok" http --help)
          "$RUNNER_TEMP/ngrok-bin/ngrok" config add-authtoken "$NGROK_AUTHTOKEN" > /dev/null 2>&1
          if grep -q -- '--inspect' <<< "$help_text"; then
            setsid "$RUNNER_TEMP/ngrok-bin/ngrok" http 127.0.0.1:8787 --inspect=false > "$RUNNER_TEMP/ngrok.raw.log" 2>&1 &
          else
            setsid "$RUNNER_TEMP/ngrok-bin/ngrok" http 127.0.0.1:8787 > "$RUNNER_TEMP/ngrok.raw.log" 2>&1 &
          fi
          echo $! > "$RUNNER_TEMP/ngrok.pid"
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4040/api/tunnels -o "$RUNNER_TEMP/ngrok-tunnels.json" 2>/dev/null &&
               node -e 'const t=require(process.env.RUNNER_TEMP+"/ngrok-tunnels.json"); process.exit(t.tunnels?.some(x=>x.public_url?.startsWith("https://"))?0:1)'; then break; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/ngrok.pid")" 2>/dev/null; then echo 'TUNNEL START FAILED' >&2; exit 1; fi
            sleep 2
          done
          node -e '
            const fs = require("node:fs");
            const tunnels = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/ngrok-tunnels.json", "utf8"));
            const https = tunnels.tunnels?.find((item) => item.public_url?.startsWith("https://"));
            if (!https) throw new Error("No HTTPS tunnel found");
            const origin = new URL(https.public_url).origin;
            if (origin.includes("mcp.holymedia.kz")) throw new Error("Non-disposable origin");
            for (const name of ["TUNNEL_ORIGIN", "HOLYMEDIA_PUBLIC_BASE_URL", "CORS_ORIGINS", "NEXT_PUBLIC_API_BASE_URL"])
              fs.appendFileSync(process.env.GITHUB_ENV, `${name}=${origin}\n`);
          '
      - name: Build API and Web with discovered tunnel origin
        shell: bash
        run: |
          set -euo pipefail
          test "$HOLYMEDIA_PUBLIC_BASE_URL" = "$TUNNEL_ORIGIN"
          test "$NEXT_PUBLIC_API_BASE_URL" = "$TUNNEL_ORIGIN"
          pnpm build
      - name: Seed disposable OWNER and read-only preflight fixture
        shell: bash
        env:
          PUBLIC_MCP_ACCEPTANCE_EMAIL: ${{ secrets.PUBLIC_MCP_ACCEPTANCE_EMAIL }}
          PUBLIC_MCP_ACCEPTANCE_PASSWORD: ${{ secrets.PUBLIC_MCP_ACCEPTANCE_PASSWORD }}
        run: node scripts/public_mcp_devmode_seed.mjs
      - name: Start API and Web without a worker
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          setsid node apps/api/dist/main.js > "$RUNNER_TEMP/api.raw.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          setsid pnpm --filter @holymedia/web exec next start -H 127.0.0.1 -p 3000 > "$RUNNER_TEMP/web.raw.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/web.pid"
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:4000/health -o /dev/null &&
               curl -fsS http://127.0.0.1:4000/ready -o /dev/null &&
               curl -fsS http://127.0.0.1:3000/api/health -o /dev/null; then exit 0; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/api.pid")" 2>/dev/null || ! kill -0 "$(cat "$RUNNER_TEMP/web.pid")" 2>/dev/null; then
              echo 'APPLICATION START FAILED' >&2
              exit 1
            fi
            sleep 2
          done
          echo 'APPLICATION HEALTH TIMEOUT' >&2
          exit 1
      - name: Verify public OAuth, MCP, Web and write-denial boundaries
        shell: bash
        run: node scripts/public_mcp_devmode_preflight.mjs
      - name: Show only public URL and human acceptance instructions
        shell: bash
        run: |
          {
            echo '## PUBLIC MCP DEVELOPER MODE ACCEPTANCE'
            echo
            echo "PUBLIC MCP DEVELOPER URL: $TUNNEL_ORIGIN/mcp/public"
            echo
            echo 'LOGIN: use repository secret PUBLIC_MCP_ACCEPTANCE_EMAIL'
            echo
            echo 'ChatGPT → Settings → Security and login → Developer mode ON → Plugins → + → Public MCP URL → Create.'
            echo
            echo 'Environment remains available for 60 minutes, then is destroyed. See docs/public-mcp-developer-mode-acceptance.md.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep disposable environment alive for manual acceptance
        shell: bash
        run: |
          set -euo pipefail
          for minute in {1..30}; do
            for process in gateway api web ngrok; do
              kill -0 "$(cat "$RUNNER_TEMP/$process.pid")"
            done
            curl -fsS http://127.0.0.1:8787/ready -o /dev/null
            curl -fsS http://127.0.0.1:8787/api/health -o /dev/null
            curl -fsS http://127.0.0.1:4040/api/tunnels -o /dev/null
            echo "ACCEPTANCE HEALTH PASS: interval $minute/30"
            sleep 120
          done
      - name: Stop tunnel, gateway, API and Web
        if: always()
        shell: bash
        run: |
          for process in ngrok gateway api web; do
            if [ -f "$RUNNER_TEMP/$process.pid" ]; then
              kill -- "-$(cat "$RUNNER_TEMP/$process.pid")" 2>/dev/null || true
            fi
          done
      - name: Export allowlisted gateway/API telemetry only
        id: log_export
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/public_mcp_devmode_logs.mjs "$RUNNER_TEMP/api.raw.log" "$RUNNER_TEMP/gateway.raw.log" "$RUNNER_TEMP/public-mcp-safe-logs"
          if grep -Eiq 'Bearer|Authorization|Cookie|CSRF|oauth.?code|access_token|refresh_token|hmap_|hmpp_' "$RUNNER_TEMP/public-mcp-safe-logs/"*.jsonl; then
            echo 'SANITIZED LOG REVIEW FAILED' >&2
            exit 1
          fi
      - name: Upload sanitized logs only
        if: always() && steps.log_export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: public-mcp-developer-mode-sanitized-logs
          path: ${{ runner.temp }}/public-mcp-safe-logs/*.jsonl
          if-no-files-found: ignore
          retention-days: 1
