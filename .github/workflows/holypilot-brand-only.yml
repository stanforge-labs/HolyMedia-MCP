name: HolyPilot branding only preservation

on:
  push:
    branches:
      - codex/holypilot-brand-only
    paths:
      - "apps/web/**"
      - "scripts/holypilot-brand-only/**"
      - ".github/workflows/holypilot-brand-only.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserve-production-design:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: python -m pip install Pillow==12.3.0
      - name: Compare exact production source with the isolated branding patch
        run: bash scripts/holypilot-brand-only/ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holypilot-brand-only-comparison
          path: .local/holypilot-brand-only-ci
          if-no-files-found: ignore
