name: HolyMedia MCP v2 foundation

on:
  push:
    branches:
      [
        main,
        "v2/**",
        "feat/**",
        "codex/google-ads-stage01-integration-final",
        "codex/google-ads-write-stage234-integration",
        "codex/google-ads-write-stage2-completion",
        "codex/google-ads-write-stage3-targeting",
        "codex/google-ads-write-stage4-ads-assets",
      ]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_ENV: test
      V2_INTEGRATION_TESTS: "true"
      V2_PG18_REHEARSAL: "true"
      V2_PG18_TEST_DATABASE_URL: postgresql://holymedia:change-me-local-only@127.0.0.1:5432/public_mcp_upgrade
      PROVIDER_GOOGLE_ADS_WRITE_ENABLED: "false"
      PROVIDER_GOOGLE_ADS_STAGE2_WRITE_ENABLED: "false"
      PROVIDER_GOOGLE_ADS_STAGE3_WRITE_ENABLED: "false"
      PROVIDER_GOOGLE_ADS_STAGE4_WRITE_ENABLED: "false"
      GOOGLE_ADS_WRITE_ACCOUNT_ALLOWLIST: ""
      PUBLIC_MCP_WRITE_SCOPE_ENABLED: "false"
      PUBLIC_MCP_CONTROLLED_WRITE_ENABLED: "false"
      DATABASE_URL: postgresql://holymedia:change-me-local-only@127.0.0.1:5432/holymedia_v2
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_HASH_SECRET: ci-only-session-hash-secret-01234567890123456789
      CORS_ORIGINS: http://127.0.0.1:3000
      PROVIDER_CREDENTIAL_ENCRYPTION_KEYS: "1:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE="
      PROVIDER_CREDENTIAL_CURRENT_KEY_VERSION: "1"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: holymedia_v2
          POSTGRES_USER: holymedia
          POSTGRES_PASSWORD: change-me-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U holymedia -d holymedia_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Secret gate before dependency execution
        run: node --test scripts/v2-secret-scan.test.mjs && node scripts/v2-secret-scan.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm migrate:validate
      - run: pnpm --filter @holymedia/database prisma:deploy
      - name: Migration rehearsal contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v2-provider-migration.mjs validate scripts/fixtures/v2-migration-bundle.example.json
          node scripts/v2-provider-migration.mjs dry-run scripts/fixtures/v2-migration-bundle.example.json | tee /tmp/v2-migration-plan.json
          grep -q '"mutatesDatabase": false' /tmp/v2-migration-plan.json
      - name: Migration rehearsal import on isolated PostgreSQL database
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=change-me-local-only
          psql "postgresql://holymedia@127.0.0.1:5432/holymedia_v2" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE holymedia_v2_rehearsal'
          export DATABASE_URL=postgresql://holymedia:change-me-local-only@127.0.0.1:5432/holymedia_v2_rehearsal
          pnpm --filter @holymedia/database prisma:deploy
          export V2_MIGRATION_TARGET=REHEARSAL
          export V2_DATABASE_URL=$DATABASE_URL
          node scripts/v2-migration-import.mjs scripts/fixtures/v2-migration-bundle.example.json
          node scripts/v2-migration-import.mjs scripts/fixtures/v2-migration-bundle.example.json
      - name: Backup and restore rehearsal database
        shell: bash
        run: |
          set -euo pipefail
          postgres_container=$(docker ps --filter ancestor=postgres:18-alpine --format '{{.ID}}' | head -n 1)
          test -n "$postgres_container"
          docker exec "$postgres_container" psql -U holymedia -d holymedia_v2 -v ON_ERROR_STOP=1 -c 'CREATE DATABASE holymedia_v2_restore'
          docker exec "$postgres_container" pg_dump -U holymedia -d holymedia_v2_rehearsal --format=plain --clean --if-exists --no-owner --no-privileges > /tmp/holymedia-v2-rehearsal.sql
          docker exec -i "$postgres_container" psql -U holymedia -d holymedia_v2_restore -v ON_ERROR_STOP=1 < /tmp/holymedia-v2-rehearsal.sql
          restored_users=$(docker exec "$postgres_container" psql -U holymedia -d holymedia_v2_restore -Atc 'SELECT COUNT(*) FROM users')
          restored_workspaces=$(docker exec "$postgres_container" psql -U holymedia -d holymedia_v2_restore -Atc 'SELECT COUNT(*) FROM workspaces')
          test "$restored_users" -ge 1
          test "$restored_workspaces" -ge 1
      - name: Prepare separate disposable PostgreSQL 18 preview database
        env:
          DATABASE_URL: postgresql://holymedia:change-me-local-only@127.0.0.1:5432/public_mcp_upgrade
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U holymedia public_mcp_upgrade
          pnpm --filter @holymedia/database prisma:deploy
      - run: pnpm test
      - run: pnpm build
      - name: API readiness integration smoke
        shell: bash
        run: |
          node apps/api/dist/main.js > /tmp/holymedia-v2-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/ready > /tmp/ready.json; then
              curl --fail --silent http://127.0.0.1:4000/health > /tmp/health.json
              cat /tmp/health.json
              cat /tmp/ready.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/holymedia-v2-api.log
          exit 1
      - name: Worker job integration smoke
        shell: bash
        run: |
          node apps/worker/dist/main.js > /tmp/holymedia-v2-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if grep -q 'foundation job processed' /tmp/holymedia-v2-worker.log; then
              cat /tmp/holymedia-v2-worker.log
              exit 0
            fi
            sleep 1
          done
          cat /tmp/holymedia-v2-worker.log
          exit 1
      - name: API dependency degradation smoke
        shell: bash
        run: |
          node apps/api/dist/main.js > /tmp/holymedia-v2-degradation-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          wait_ready() {
            for attempt in {1..30}; do
              if curl --fail --silent http://127.0.0.1:4000/ready > /tmp/ready.json; then
                return 0
              fi
              sleep 1
            done
            cat /tmp/holymedia-v2-degradation-api.log
            return 1
          }
          assert_not_ready() {
            local status
            status=$(curl --silent --output /tmp/ready-degraded.json --write-out '%{http_code}' http://127.0.0.1:4000/ready || true)
            test "$status" != "200"
          }
          wait_ready

          postgres_id=$(docker ps --filter ancestor=postgres:18-alpine --format '{{.ID}}' | head -n 1)
          test -n "$postgres_id"
          docker stop "$postgres_id"
          assert_not_ready
          docker start "$postgres_id"
          wait_ready

          redis_id=$(docker ps --filter ancestor=redis:7.4-alpine --format '{{.ID}}' | head -n 1)
          test -n "$redis_id"
          docker stop "$redis_id"
          assert_not_ready
          docker start "$redis_id"
          wait_ready
      - run: pnpm security:secrets
      - run: pnpm security:deps
