name: QRS TEST Web image (no deploy)

on:
  push:
    branches:
      [codex/google-ads-write-full-scope-final, codex/qrs-test-auth-recovery]
    paths:
      - .github/workflows/qrs-test-web-image.yml
      - infra/Dockerfile.v2
      - infra/test-mcp/**
      - scripts/qrs-test-edge-contract.test.mjs
      - apps/web/**
      - packages/contracts/**
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/stanforge-labs/holymedia-mcp-v2:qrs-test-web-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - run: node --test scripts/qrs-test-edge-contract.test.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse immutable TEST tag when already verified
        id: existing
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            docker pull "$IMAGE"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" = "${{ github.sha }}"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.present != 'true'
        id: image
        with:
          context: .
          file: infra/Dockerfile.v2
          target: test-web-runtime
          build-args: |
            NODE_BASE_IMAGE=public.ecr.aws/docker/library/node:24-bookworm-slim
            NEXT_PUBLIC_API_BASE_URL=https://mcp-test.holymedia.kz
            NEXT_PUBLIC_PUBLIC_BASE_URL=https://mcp-test.holymedia.kz
            NEXT_PUBLIC_GOOGLE_LOGIN_ENABLED=true
            NEXT_PUBLIC_TEST_RESTRICTED_AUTH=true
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.holymedia.acceptance-only=true
            org.holymedia.test-origin=mcp-test.holymedia.kz
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify pinned Web runtime and TEST origin
        run: |
          reference="$IMAGE@${{ steps.existing.outputs.digest || steps.image.outputs.digest }}"
          docker pull "$reference"
          test "$(docker image inspect --format '{{.Config.User}}' "$reference")" = node
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$reference")" = "${{ github.sha }}"
          docker run --rm --entrypoint sh "$reference" -ec '
            test -f apps/web/.next/BUILD_ID
            test ! -e apps/api/dist/main.js
            test ! -e apps/worker/dist/main.js
            test ! -d .git
            test ! -e .env
            grep -Rql "https://mcp-test.holymedia.kz" apps/web/.next
          '
          echo "QRS TEST-only Web digest: $reference" >> "$GITHUB_STEP_SUMMARY"
          echo "No VPS or production deployment performed." >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke TEST login and consent pages on CI loopback
        run: |
          reference="$IMAGE@${{ steps.existing.outputs.digest || steps.image.outputs.digest }}"
          docker run -d --name qrs-web-smoke --publish 127.0.0.1:13300:3000 \
            --workdir /workspace/apps/web "$reference" ./node_modules/.bin/next start
          trap 'docker rm -f qrs-web-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:13300/auth && \
               curl -fsS -o /dev/null http://127.0.0.1:13300/connect/claude && \
               curl -fsS -o /dev/null http://127.0.0.1:13300/mcp/approve; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 40 qrs-web-smoke
          exit 1
