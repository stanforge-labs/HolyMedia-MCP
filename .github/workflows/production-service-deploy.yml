name: Production service deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-services
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ $BEFORE =~ ^0+$ ]]; then BEFORE=$(git rev-parse HEAD^); fi
          git diff --name-only "$BEFORE" "$GITHUB_SHA" > /tmp/changed-paths
          services=()
          if grep -Eq '^(apps/web/|packages/contracts/|infra/Dockerfile.v2$|package.json$|pnpm-lock.yaml$|pnpm-workspace.yaml$|turbo.json$|tsconfig.base.json$)' /tmp/changed-paths; then services+=(web); fi
          if grep -Eq '^(apps/api/|packages/(config|contracts|database|observability|site-audit)/|infra/(Dockerfile.v2|api-runtime.pnpm-workspace.yaml)$|package.json$|pnpm-lock.yaml$|pnpm-workspace.yaml$|turbo.json$|tsconfig.base.json$)' /tmp/changed-paths; then services+=(api); fi
          if grep -Eq '^(apps/worker/|packages/(config|contracts|database|observability|site-audit)/|infra/(Dockerfile.v2|worker-runtime.pnpm-workspace.yaml)$|package.json$|pnpm-lock.yaml$|pnpm-workspace.yaml$|turbo.json$|tsconfig.base.json$)' /tmp/changed-paths; then services+=(worker); fi
          printf 'services=%s\n' "$(printf '%s\n' "${services[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Verify changed service
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          if [[ "${{ matrix.service }}" != web ]]; then
            pnpm --dir packages/database run prisma:generate
          fi
          pnpm exec turbo run build --filter="@holymedia/${{ matrix.service }}..."
          pnpm --filter "@holymedia/${{ matrix.service }}" lint
          pnpm --filter "@holymedia/${{ matrix.service }}" test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push service image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.v2
          target: ${{ matrix.service == 'api' && 'api-runtime' || format('production-{0}-runtime', matrix.service) }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/stanforge-labs/holymedia-mcp-v2:${{ matrix.service }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://mcp.holymedia.kz
            NEXT_PUBLIC_PUBLIC_BASE_URL=https://mcp.holymedia.kz
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: Deploy exact digest
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.PROD_DEPLOY_HOST_KEY }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST_KEY"
          test -n "$DIGEST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/production_deploy
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/production_deploy ~/.ssh/known_hosts
          ssh -i ~/.ssh/production_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            holymedia-deploy@77.240.38.131 \
            "deploy ${{ matrix.service }} ghcr.io/stanforge-labs/holymedia-mcp-v2@$DIGEST $GITHUB_SHA"
          rm -f ~/.ssh/production_deploy
