name: HolyMedia Public MCP staging image (explicit staging-branch trigger)

on:
  # workflow_dispatch needs a copy on the default branch before GitHub will
  # expose it. Until then, only an explicit marker commit on this dedicated
  # staging-build branch can run the job. Feature-branch pushes do nothing.
  push:
    branches: [codex/public-mcp-staging-image]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  STAGING_ORIGIN: https://v2-staging-mcp.holymedia.kz

jobs:
  build-staging-only:
    if: github.ref == 'refs/heads/codex/public-mcp-staging-image' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-staging-image]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact selected staging-build commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source

      - name: Verify exact source and staging-only build recipe
        shell: bash
        run: |
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"
          test -f source/infra/Dockerfile.v2.staging
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/holymedia-mcp-v2-staging:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
        id: image

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging-only SHA image
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/infra/Dockerfile.v2.staging
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.image }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.holymedia.build.recipe_revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.STAGING_ORIGIN }}
            NEXT_PUBLIC_PUBLIC_BASE_URL=${{ env.STAGING_ORIGIN }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=public-staging
          cache-to: type=gha,scope=public-staging,mode=max
